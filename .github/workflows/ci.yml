# Verificación de cada cambio: lint y build de la app, que vive en frontend/.
#
# No hay tests que correr ni deploy que hacer aquí: el despliegue lo hace
# Vercel por su cuenta en cada push y cada PR.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verificar:
    name: Lint y build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
